<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in - Evidentia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090e;
            --surface: #111520;
            --surface-2: #1b2131;
            --border: #2a3449;
            --ink: #e8ecf3;
            --muted: #919eb5;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-ink: #ffffff;
            --danger: #ef4444;
            --danger-dim: rgba(239, 68, 68, 0.15);
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
            margin: 0; padding: 0;
            color: var(--ink);
            background: var(--bg);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            width: 100%; max-width: 340px; margin: 0 auto;
            background: var(--surface); border: 1px solid var(--border);
            border-top: 2px solid var(--accent);
            padding: 34px; border-radius: 10px;
        }
        .login-box .brand-row {
            display: flex; align-items: center; gap: 11px; margin-bottom: 26px;
        }
        .login-box .mark {
            width: 30px; height: 30px; flex-shrink: 0;
            border: 1.5px solid var(--accent); border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-family: "Fraunces", serif; font-weight: 700; font-size: 14px;
            color: var(--accent);
        }
        .login-box h1 {
            font-family: "Fraunces", serif; font-style: italic; font-weight: 600;
            font-size: 20px; margin: 0; letter-spacing: 0.01em;
        }
        .login-box input {
            width: 100%; padding: 11px 13px; margin-bottom: 12px; box-sizing: border-box;
            font-size: 14px; font-family: inherit; color: var(--ink);
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
            transition: border-color 0.15s ease;
        }
        .login-box input::placeholder { color: var(--muted); }
        .login-box input:focus { outline: none; border-color: var(--accent); }
        .login-box button {
            width: 100%; padding: 11px; margin-top: 4px;
            background: var(--accent); color: var(--accent-ink); border: none;
            border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: background 0.15s ease;
        }
        .login-box button:hover { background: var(--accent-hover); }
        .error {
            background: var(--danger-dim); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger);
            padding: 10px 12px; font-size: 13px; margin-bottom: 14px; border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="brand-row">
        <span class="mark">E</span>
        <h1>Evidentia</h1>
    </div>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log in</button>
    </form>
</div>
</body>
</html>
