<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in - Evidentia</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; color: #1a1a1a; background: #f4f4f4; }
        .login-box { max-width: 320px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        .login-box h1 { font-size: 18px; margin-top: 0; }
        .login-box input { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; font-size: 14px; }
        .login-box button { width: 100%; padding: 10px; background: #14213d; color: #fff; border: none; font-size: 14px; cursor: pointer; }
        .error { background: #fee2e2; border: 1px solid #dc2626; padding: 8px 10px; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Evidentia Dashboard</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log in</button>
        </form>
    </div>
</body>
</html>
